name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.7.x requires Python >=3.14.2.
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run backend tests
        # Runs each test file in its own process (see tests/conftest.py):
        # modules install conflicting sys.modules stubs at import time, so a
        # single pytest process would cross-pollute.
        run: bash scripts/run_tests.sh

  release:
    # Gate the release on a green test run, and only release on pushes to main
    # (not on pull requests).
    needs: backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: git submodule update --init frontend/hass-frontend
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm install
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
