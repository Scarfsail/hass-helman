name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.7.x requires Python >=3.14.2.
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run backend tests
        # Runs each test file in its own process (see tests/conftest.py):
        # modules install conflicting sys.modules stubs at import time, so a
        # single pytest process would cross-pollute.
        run: bash scripts/run_tests.sh
